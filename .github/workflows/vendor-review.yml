name: Vendor maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 1'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check vendored library version and advisories
        run: node scripts/check-vendor.mjs
